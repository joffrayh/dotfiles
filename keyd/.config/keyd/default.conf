[ids]
*

[global]
chord_timeout = 20

[main]
# tap = Esc, hold = nav layer
capslock = overloadt2(nav, esc, 200)
#keep Caps Lock key aroud
esc = capslock

# bracket combos: open on the left hand, close on the righ
r+e = S-9
i+u = S-0
f+d = leftbrace
k+j = rightbrace
v+c = S-leftbrace
m+, = S-rightbrace

[nav]
h = left
j = down
k = up
l = right

# word jumps
y = C-left
o = C-right

# line start/end
u = home
i = end

# page up/down
n = pagedown
m = pageup

# deleting
x = backspace
d = delete
